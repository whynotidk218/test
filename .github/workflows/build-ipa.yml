name: Build IPA for AltStore

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Lấy code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Cài công cụ
      run: |
        brew install cmake ninja

    - name: Build IPA
      run: |
        mkdir build
        cd build
        
        # Lệnh này tạo file project cho iOS
        cmake .. \
          -G "Xcode" \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
          -DCMAKE_XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY="1,2" \
          -DCMAKE_XCODE_ATTRIBUTE_INFOPLIST_FILE=${GITHUB_WORKSPACE}/Info.plist

        # Lệnh này nén code lại thành .ipa (không cần ký số)
        xcodebuild -project CasioEmuMsvc.xcodeproj \
          -scheme CasioEmuMsvc \
          -configuration Release \
          -archivePath App.xcarchive \
          -archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

        # Lệnh này xuất file .ipa ra ngoài
        # Tạo file cấu hình xuất tạm
        cat > ../ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>AAAAAAAAAA</string>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath App.xcarchive \
          -exportPath ../output \
          -exportOptionsPlist ../ExportOptions.plist

    - name: Tải file IPA về
      uses: actions/upload-artifact@v3
      with:
        name: App-IPA
        path: output/*.ipa
