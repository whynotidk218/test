name: Build IPA for AltStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Lấy code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cài công cụ
      run: |
        brew install cmake ninja

    - name: Build IPA
      run: |
        # 1. Vào thư mục con chứa project gốc
        cd CasioEmuMsvc
        
        # 2. Tạo thư mục build ở đây
        mkdir build
        cd build

        # 3. Chạy CMake (nó sẽ dùng file CMakeLists.txt vừa sửa)
        cmake .. \
          -G "Xcode" \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
          -DCMAKE_XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY="1,2" \
          -DCMAKE_XCODE_ATTRIBUTE_INFOPLIST_FILE=${GITHUB_WORKSPACE}/Info.plist

        # 4. Tìm và Build
        # Vì CMakeLists.txt nằm ở trong CasioEmuMsvc, nên file project sẽ sinh ra ở đây
        PROJECT_FILE=$(ls *.xcodeproj | head -n 1)
        SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list | grep -A 10 "Schemes:" | grep -v "Schemes:" | grep -v "^$" | head -n 1 | xargs)

        echo "Building project: $PROJECT_FILE with scheme: $SCHEME_NAME"

        xcodebuild -project "$PROJECT_FILE" \
          -scheme "$SCHEME_NAME" \
          -configuration Release \
          -archivePath App.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

        # 5. Export IPA
        # Tạo file cấu hình export ở thư mục gốc để dễ tìm
        cat > ${GITHUB_WORKSPACE}/ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>AAAAAAAAAA</string>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath App.xcarchive \
          -exportPath ${GITHUB_WORKSPACE}/output \
          -exportOptionsPlist ${GITHUB_WORKSPACE}/ExportOptions.plist

    - name: Tải file IPA về
      uses: actions/actions/upload-artifact@v4
      with:
        name: App-IPA
        path: output/*.ipa
        if-no-files-found: warn
