name: Build IPA for AltStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Lấy code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cài công cụ
      run: |
        brew install cmake ninja

    - name: Build IPA
      run: |
        mkdir build
        cd build
        
        # 1. Cấu hình CMake tạo Project iOS
        cmake .. \
          -G "Xcode" \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
          -DCMAKE_XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY="1,2" \
          -DCMAKE_XCODE_ATTRIBUTE_INFOPLIST_FILE=${GITHUB_WORKSPACE}/Info.plist

        # 2. Build Archive
        # Lưu ý: Đã thêm tham số -scheme ở đây để sửa lỗi
        xcodebuild -project CasioEmuMsvc.xcodeproj \
          -scheme CasioEmuMsvc \
          -configuration Release \
          -archivePath App.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

        # 3. Export ra IPA
        # Tạo file cấu hình export tạm thời
        cat > ../ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>AAAAAAAAAA</string>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath App.xcarchive \
          -exportPath ../output \
          -exportOptionsPlist ../ExportOptions.plist

    - name: Tải file IPA về
      uses: actions/upload-artifact@v4
      with:
        name: App-IPA
        path: output/*.ipa
        if-no-files-found: warn
