name: Build iOS IPA (again)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Validate and fix submodules
        run: |
          git submodule update --init --recursive --force
          # Tạo liên kết thư mục để các lệnh gọi include không bị lỗi
          ln -sf SDL SDL2
          ln -sf SDL_image SDL2_image

      - name: Patch SDL_image for ARC
        run: |
          if [ -f SDL_image/src/IMG_ImageIO.m ]; then
            sed -i '' 's/NSData\* data = (id)CGDataProviderCopyData(provider);/NSData* data = (__bridge_transfer NSData*)CGDataProviderCopyData(provider);/' SDL_image/src/IMG_ImageIO.m
            sed -i '' '/\[data autorelease\];/d' SDL_image/src/IMG_ImageIO.m
            echo "✅ Patched IMG_ImageIO.m"
          fi

      - name: Create iOS Structure
        run: |
          mkdir -p ios_build/Payload/CasioEmu.app
          
          # Cấu hình Info.plist tích hợp tính năng File Sharing để nạp ROM sau này
          cat > ios_build/Payload/CasioEmu.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>CasioEmu</string>
              <key>CFBundleIdentifier</key>
              <string>com.pkdev.casioemu</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>CasioEmu</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Gather Local Repo Resources
        run: |
          cd ios_build
          echo "🔍 Đang rà soát và lấy file nguồn trực tiếp từ repo..."
          
          # Tìm tất cả file .cpp trong thư mục src ở gốc repo của bạn
          if [ -d "../src" ]; then
            find ../src -name "*.cpp" ! -name "*Win32*" ! -name "*Linux*" ! -name "*SysDialog.cpp*" > sources.txt
          elif [ -d "../CasioEmuMsvc/src" ]; then
            find ../CasioEmuMsvc/src -name "*.cpp" ! -name "*Win32*" ! -name "*Linux*" ! -name "*SysDialog.cpp*" > sources.txt
          else
            # Nếu để code ngay ngoài thư mục gốc
            find .. -maxdepth 2 -name "*.cpp" ! -name "*Win32*" ! -name "*Linux*" > sources.txt
          fi
          
          # Lấy tài nguyên từ thư viện SDL2 đi kèm repo
          if [ -d "../SDL/src" ]; then
            find ../SDL/src -name "*.c" ! -name "*windows*" ! -name "*android*" ! -name "*linux*" ! -name "*winrt*" >> sources.txt
          fi
          
          # Lấy tài nguyên từ thư viện SDL_image đi kèm repo
          if [ -d "../SDL_image/src" ]; then
            find ../SDL_image/src -name "*.c" >> sources.txt
          fi

          # Tạo file mock SysDialog để tránh lỗi thiếu thư viện giao diện máy tính
          cat > SysDialog_mock.cpp << 'EOF'
          #include <string>
          class SysDialog {
          public:
              static void ShowMessageBox(const std::string& t, const std::string& m) {}
              static bool ShowOpenFileDialog(const std::string& t, const std::string& f, std::string& o) { return false; }
              static bool ShowSaveFileDialog(const std::string& t, const std::string& f, std::string& o) { return false; }
              static bool ShowFolderDialog(const std::string& t, std::string& o) { return false; }
          };
          EOF
          echo "SysDialog_mock.cpp" >> sources.txt
          
          echo "📊 Danh sách file thu thập được để chế tạo:"
          cat sources.txt

      - name: Compile and Link From List
        run: |
          cd ios_build
          
          # Xác định đường dẫn include đúng dựa vào cấu trúc repo
          INCLUDES="-I../SDL/include -I../SDL_image"
          if [ -d "../src" ]; then INCLUDES="$INCLUDES -I../src"; fi
          if [ -d "../CasioEmuMsvc/src" ]; then INCLUDES="$INCLUDES -I../CasioEmuMsvc/src"; fi
          
          echo "🚀 Kích hoạt Clang biên dịch trực tiếp danh sách tài nguyên..."
          xcrun -sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            $INCLUDES \
            -D__IPHONEOS__ -D__APPLE__ -DSDL_VIDEO_DRIVER_UIKIT=1 \
            -std=c++17 -O2 \
            -filelist sources.txt \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework OpenGLES -framework AudioToolbox -framework CoreAudio -framework AVFoundation -framework GameController -framework CoreMotion \
            -o Payload/CasioEmu.app/CasioEmu

      - name: Finalize and Package IPA
        run: |
          cd ios_build
          echo "📊 Kích thước file thực thi sau khi chế tạo:"
          ls -lh Payload/CasioEmu.app/CasioEmu || echo "⚠️ Không tìm thấy file thực thi!"
          
          echo "🗜️ Đóng gói thành tệp cài đặt định dạng .ipa..."
          zip -r ../CasioEmuMsvc.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmu-RepoResource
          path: CasioEmuMsvc.ipa
          retention-days: 7
