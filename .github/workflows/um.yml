name: Build iOS IPA (unsigned)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Validate and fix submodules
        run: |
          echo "🔍 Checking submodules..."
          git submodule status
          git submodule update --init --recursive --force

          if [ ! -d SDL/CMakeLists.txt ]; then
            echo "⚠️ SDL submodule incomplete, re-initializing..."
            rm -rf SDL
            git submodule update --init --force SDL
          fi
          if [ ! -f SDL_image/CMakeLists.txt ]; then
            echo "⚠️ SDL_image submodule incomplete, re-initializing..."
            rm -rf SDL_image
            git submodule update --init --force SDL_image
          fi
          echo "✓ Submodules validated"

      - name: Create symlinks for SDL2 compatibility (root level)
        run: |
          # Tạo symlink ở thư mục gốc để CMake trong CasioEmuMsvc thấy ../SDL2
          ln -sf SDL SDL2
          ln -sf SDL_image SDL2_image
          echo "Symlinks created:"
          ls -la | grep SDL

      - name: Install iOS CMake toolchain
        run: |
          curl -L -o ios.toolchain.cmake https://raw.githubusercontent.com/leetal/ios-cmake/master/ios.toolchain.cmake

      - name: Create build directory
        run: mkdir -p build-ios

      - name: Configure CMake for iOS (device)
        run: |
          cd build-ios
          cmake .. -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=../ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=OFF

      - name: Build with Xcode (unsigned)
        run: |
          cd build-ios
          xcodebuild -project CasioEmuMsvc.xcodeproj \
            -scheme CasioEmuMsvc \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .app into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found!"
            exit 1
          fi
          echo "Found .app at $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r CasioEmuMsvc-unsigned.ipa Payload/

      - name: Upload unsigned IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-unsigned
          path: CasioEmuMsvc-unsigned.ipa
          retention-days: 7
