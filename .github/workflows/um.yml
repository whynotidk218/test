name: Build iOS IPA (Local Repo Resource)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Validate and fix submodules
        run: |
          git submodule update --init --recursive --force
          ln -sf SDL SDL2
          ln -sf SDL_image SDL2_image

      - name: Patch SDL_image for ARC
        run: |
          if [ -f SDL_image/src/IMG_ImageIO.m ]; then
            sed -i '' 's/NSData\* data = (id)CGDataProviderCopyData(provider);/NSData* data = (__bridge_transfer NSData*)CGDataProviderCopyData(provider);/' SDL_image/src/IMG_ImageIO.m
            sed -i '' '/\[data autorelease\];/d' SDL_image/src/IMG_ImageIO.m
            echo "✅ Patched IMG_ImageIO.m"
          fi

      - name: Create iOS Structure
        run: |
          mkdir -p ios_build/Payload/CasioEmu.app
          
          cat > ios_build/Payload/CasioEmu.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>CasioEmu</string>
              <key>CFBundleIdentifier</key>
              <string>com.pkdev.casioemu</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>CasioEmu</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Create Mocks for Desktop Features
        run: |
          mkdir -p ios_build
          # Tạo file mock thay thế các tính năng gây lỗi biên dịch hoặc không tương thích iOS
          cat > ios_build/SysDialog_mock.cpp << 'EOF'
          #include <string>
          class SysDialog {
          public:
              static void ShowMessageBox(const std::string& t, const std::string& m) {}
              static bool ShowOpenFileDialog(const std::string& t, const std::string& f, std::string& o) { return false; }
              static bool ShowSaveFileDialog(const std::string& t, const std::string& f, std::string& o) { return false; }
              static bool ShowFolderDialog(const std::string& t, std::string& o) { return false; }
          };
          EOF

      - name: Compile and Link Real-time
        run: |
          cd ios_build
          
          echo "🔍 Quét và nạp danh sách tài nguyên file..."
          # Tìm các file nguồn hợp lệ, chủ động loại bỏ các file chạy nền desktop độc quyền gây crash/lỗi link
          SRC_DIR="../CasioEmuMsvc/src"
          if [ -d "../src" ]; then SRC_DIR="../src"; fi
          
          # Gom file C++ của giả lập (Bỏ qua các file lỗi hệ thống nền web/discord/windows)
          FILES_TO_COMPILE=$(find "$SRC_DIR" -name "*.cpp" ! -name "*Win32*" ! -name "*Linux*" ! -name "*SysDialog.cpp*" ! -name "*DiscordRPC.cpp*" ! -name "*CrashHandler.cpp*" ! -name "*web_main.cpp*" ! -name "*core_api.cpp*")
          
          # Gom thêm file C của SDL2 và SDL_image
          if [ -d "../SDL/src" ]; then
            FILES_TO_COMPILE="$FILES_TO_COMPILE $(find ../SDL/src -name "*.c" ! -name "*windows*" ! -name "*android*" ! -name "*linux*" ! -name "*winrt*")"
          fi
          if [ -d "../SDL_image/src" ]; then
            FILES_TO_COMPILE="$FILES_TO_COMPILE $(find ../SDL_image/src -name "*.c")"
          fi
          
          # Đính kèm file mock chúng ta vừa viết
          FILES_TO_COMPILE="$FILES_TO_COMPILE SysDialog_mock.cpp"
          
          echo "📊 Tổng số lượng file đưa vào chế tạo: $(echo $FILES_TO_COMPILE | wc -w)"

          # Thiết lập cấu hình include đường dẫn thư viện
          INCLUDES="-I../SDL/include -I../SDL_image -I$SRC_DIR"
          
          echo "🚀 Ép biên dịch trực tiếp (Không qua filelist trung gian)..."
          xcrun -sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            $INCLUDES \
            -D__IPHONEOS__ -D__APPLE__ -DSDL_VIDEO_DRIVER_UIKIT=1 \
            -std=c++17 -O2 \
            $FILES_TO_COMPILE \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework OpenGLES -framework AudioToolbox -framework CoreAudio -framework AVFoundation -framework GameController -framework CoreMotion \
            -o Payload/CasioEmu.app/CasioEmu

      - name: Finalize and Package IPA
        run: |
          cd ios_build
          echo "📊 Kích thước file thực thi sau khi chế tạo hoàn chỉnh:"
          ls -lh Payload/CasioEmu.app/CasioEmu || echo "⚠️ Cảnh báo: Build lỗi!"
          
          echo "🗜️ Đóng gói Payload thành .ipa..."
          zip -r ../CasioEmuMsvc.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmu-FixedLinker
          path: CasioEmuMsvc.ipa
          retention-days: 7
