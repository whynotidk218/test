name: Build IPA (Linux - Không cần Xcode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ── 1. Lấy code ────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ── 2. Cài toolchain ───────────────────────────────────────────
    - name: Cài clang + build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          clang-14 lld-14 cmake ninja-build \
          git curl tar xz-utils zip python3

        # Alias để gọi ngắn gọn
        sudo ln -sf /usr/bin/clang-14    /usr/local/bin/clang
        sudo ln -sf /usr/bin/clang++-14  /usr/local/bin/clang++
        sudo ln -sf /usr/bin/lld-14      /usr/local/bin/lld

    # ── 3. Tải iOS SDK (theos/sdks - uy tín, tồn tại từ 2023) ─────
    - name: Tải iOS 16.5 SDK
      run: |
        SDK_URL="https://github.com/theos/sdks/releases/download/2023-11-23/iPhoneOS16.5.sdk.tar.xz"
        echo "Tải SDK từ theos/sdks..."
        curl -L "$SDK_URL" -o iPhoneOS.sdk.tar.xz --retry 3 --retry-delay 5

        # Kiểm tra file tải về có hợp lệ không
        file iPhoneOS.sdk.tar.xz
        ls -lh iPhoneOS.sdk.tar.xz

        # Giải nén
        mkdir -p /opt/iossdk
        tar -xf iPhoneOS.sdk.tar.xz -C /opt/iossdk

        # Tìm thư mục SDK
        SDK_DIR=$(find /opt/iossdk -maxdepth 2 -name "*.sdk" -type d | head -1)
        echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
        echo "✅ SDK: $SDK_DIR"
        ls "$SDK_DIR" | head -10

    # ── 4. Build SDL2 cho iOS arm64 ─────────────────────────────────
    - name: Build SDL2
      run: |
        IOS_FLAGS="--target=arm64-apple-ios14.0 -isysroot ${{ env.SDK_DIR }}"
        cd SDL
        mkdir -p build-ios && cd build-ios
        cmake .. \
          -G Ninja \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="$IOS_FLAGS" \
          -DCMAKE_CXX_FLAGS="$IOS_FLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$IOS_FLAGS" \
          -DCMAKE_SHARED_LINKER_FLAGS="$IOS_FLAGS" \
          -DCMAKE_SYSTEM_NAME=Darwin \
          -DCMAKE_SYSTEM_PROCESSOR=arm64 \
          -DSDL_SHARED=OFF \
          -DSDL_STATIC=ON \
          -DSDL_TEST=OFF \
          -DSDL_AUDIO=ON \
          -DSDL_VIDEO=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl-install
        ninja
        ninja install
        echo "✅ SDL2 xong"

    # ── 5. Build SDL2_image cho iOS arm64 ──────────────────────────
    - name: Build SDL2_image
      run: |
        IOS_FLAGS="--target=arm64-apple-ios14.0 -isysroot ${{ env.SDK_DIR }}"
        cd SDL_image
        mkdir -p build-ios && cd build-ios
        cmake .. \
          -G Ninja \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="$IOS_FLAGS" \
          -DCMAKE_CXX_FLAGS="$IOS_FLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$IOS_FLAGS" \
          -DCMAKE_SYSTEM_NAME=Darwin \
          -DCMAKE_SYSTEM_PROCESSOR=arm64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DSDL2_DIR=$GITHUB_WORKSPACE/sdl-install/lib/cmake/SDL2 \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl-install \
          -DSDL2IMAGE_SAMPLES=OFF \
          -DSDL2IMAGE_TESTS=OFF
        ninja
        ninja install
        echo "✅ SDL2_image xong"

    # ── 6. Build app chính ──────────────────────────────────────────
    - name: Build CasioEmu
      run: |
        IOS_FLAGS="--target=arm64-apple-ios14.0 -isysroot ${{ env.SDK_DIR }}"
        mkdir -p build-ios && cd build-ios
        cmake .. \
          -G Ninja \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="$IOS_FLAGS" \
          -DCMAKE_CXX_FLAGS="$IOS_FLAGS -std=c++17" \
          -DCMAKE_EXE_LINKER_FLAGS="$IOS_FLAGS -lc++ -lz" \
          -DCMAKE_SYSTEM_NAME=Darwin \
          -DCMAKE_SYSTEM_PROCESSOR=arm64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCASIO_IOS=ON \
          -DSDL2_DIR=$GITHUB_WORKSPACE/sdl-install/lib/cmake/SDL2 \
          -DSDL2_image_DIR=$GITHUB_WORKSPACE/sdl-install/lib/cmake/SDL2_image
        ninja CasioEmuApp
        echo "✅ Build xong"
        ls -lh CasioEmuApp
        file CasioEmuApp

    # ── 7. Đóng gói thành .ipa ─────────────────────────────────────
    - name: Đóng gói IPA
      run: |
        APP_DIR="$GITHUB_WORKSPACE/Payload/CasioEmu.app"
        mkdir -p "$APP_DIR"

        # Binary
        cp build-ios/CasioEmuApp "$APP_DIR/CasioEmuApp"
        chmod +x "$APP_DIR/CasioEmuApp"

        # Info.plist (bắt buộc)
        cp Info.plist "$APP_DIR/Info.plist"

        # Assets nếu có
        for dir in CasioEmuMsvc/assets CasioEmuMsvc/models CasioEmuMsvc/res; do
          [ -d "$dir" ] && cp -r "$dir/." "$APP_DIR/"
        done

        # Fake entitlements (để Sideloadly/AltStore nhận)
        cat > /tmp/ent.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>get-task-allow</key><true/>
        </dict></plist>
        EOF

        # Cài ldid để fake-sign (Sideloadly vẫn cần binary có Mach-O header đúng)
        curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 \
          -o /usr/local/bin/ldid --retry 3
        chmod +x /usr/local/bin/ldid
        ldid -S/tmp/ent.xml "$APP_DIR/CasioEmuApp" || echo "ldid thất bại, bỏ qua - Sideloadly vẫn có thể sign"

        # Zip thành IPA
        cd "$GITHUB_WORKSPACE"
        zip -r CasioEmu.ipa Payload/
        echo "✅ IPA xong"
        ls -lh CasioEmu.ipa

    # ── 8. Upload ───────────────────────────────────────────────────
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CasioEmu-IPA
        path: CasioEmu.ipa
        if-no-files-found: error
