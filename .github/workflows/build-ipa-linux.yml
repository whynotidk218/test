name: Build CasioEmu IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          brew install cmake ninja

      - name: Configure
        run: |
          mkdir -p build-ios
          cd build-ios
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCASIO_IOS=ON \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: |
          cd build-ios
          ninja -v CasioEmuApp

      - name: Create IPA
        run: |
          mkdir -p Payload/CasioEmu.app
          cp build-ios/CasioEmuApp Payload/CasioEmu.app/
          cp Info.plist Payload/CasioEmu.app/
          chmod +x Payload/CasioEmu.app/CasioEmuApp
          zip -r CasioEmu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CasioEmu-IPA
          path: CasioEmu.ipa
