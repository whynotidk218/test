name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Fix missing submodules
        run: |
          printf "Fixing missing submodules...\n"
          git submodule deinit -f . 2>/dev/null || true
          git submodule update --init --recursive --force
          
          if [ ! -d "SDL" ] || [ -z "$(ls -A SDL)" ]; then
            printf "Cloning SDL manually...\n"
            rm -rf SDL
            git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL
          fi
          
          if [ ! -d "SDL_image" ] || [ -z "$(ls -A SDL_image)" ]; then
            printf "Cloning SDL_image manually...\n"
            rm -rf SDL_image
            git clone --depth 1 https://github.com/libsdl-org/SDL_image.git SDL_image
          fi
          
          if [ ! -d "discord-rpc" ] || [ -z "$(ls -A discord-rpc)" ]; then
            printf "Cloning discord-rpc manually...\n"
            rm -rf discord-rpc
            git clone --depth 1 https://github.com/discord/discord-rpc.git discord-rpc
          fi
          
          if [ ! -d "sentry-native" ] || [ -z "$(ls -A sentry-native)" ]; then
            printf "Cloning sentry-native manually...\n"
            rm -rf sentry-native
            git clone --depth 1 https://github.com/getsentry/sentry-native.git sentry-native
          fi
          
          printf "Submodules fixed\n"
      
      - name: Setup iOS build environment
        run: |
          printf "Setting up iOS build environment...\n"
          mkdir -p ios/build
          mkdir -p ios/Resources
          
          if [ ! -f "ios/Info.plist" ] && [ ! -f "Info.plist" ]; then
            printf "Creating Info.plist...\n"
            /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string \$(DEVELOPMENT_LANGUAGE)" ios/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string \$(EXECUTABLE_NAME)" ios/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.casioemu.ios" ios/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" ios/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string \$(PRODUCT_NAME)" ios/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" ios/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" ios/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" ios/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool true" ios/Info.plist 2>/dev/null || true
          fi
      
      - name: Fix iOS source files
        run: |
          printf "Fixing source files for iOS compatibility...\n"
          
          if [ -f "ios/AppDelegate.m" ]; then
            printf "#import <UIKit/UIKit.h>\n#import <Foundation/Foundation.h>\n" | cat - ios/AppDelegate.m > /tmp/AppDelegate.m
            mv /tmp/AppDelegate.m ios/AppDelegate.m
          fi
          
          mkdir -p ios_stubs
          printf "#ifndef platform_stubs_h\n" > ios_stubs/platform_stubs.h
          printf "#define platform_stubs_h\n" >> ios_stubs/platform_stubs.h
          printf "#ifdef __APPLE__\n" >> ios_stubs/platform_stubs.h
          printf "#include <TargetConditionals.h>\n" >> ios_stubs/platform_stubs.h
          printf "#if TARGET_OS_IPHONE\n" >> ios_stubs/platform_stubs.h
          printf "#define IOS_PLATFORM 1\n" >> ios_stubs/platform_stubs.h
          printf "#define OutputDebugStringA(msg) printf(\"%%s\", msg)\n" >> ios_stubs/platform_stubs.h
          printf "#endif\n" >> ios_stubs/platform_stubs.h
          printf "#endif\n" >> ios_stubs/platform_stubs.h
      
      - name: Build with CMake
        run: |
          printf "Building with CMake for iOS...\n"
          mkdir -p build-ios
          cd build-ios
          
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED="NO" \
            -DIOS_PLATFORM=ON \
            -DBUILD_SHARED_LIBS=OFF
          
          xcodebuild \
            -project CasioEmuMsvc.xcodeproj \
            -scheme CasioEmuMsvc \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build || true
          
          cd ..
      
      - name: Alternative xcodebuild
        if: failure()
        run: |
          printf "Trying direct xcodebuild...\n"
          XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 1 | head -n 1)
          
          if [ -n "$XCODEPROJ" ]; then
            xcodebuild \
              -project "$XCODEPROJ" \
              -scheme CasioEmuMsvc \
              -configuration Release \
              -sdk iphoneos \
              -arch arm64 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi
      
      - name: Create app bundle
        run: |
          printf "Creating app bundle...\n"
          APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v ".xcode" | head -n 1)
          fi
          
          mkdir -p Payload
          
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            printf "App bundle found at %s\n" "$APP_PATH"
          else
            printf "Creating minimal app structure...\n"
            mkdir -p Payload/CasioEmuMsvc.app
            printf "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" > Payload/CasioEmuMsvc.app/Info.plist
            printf "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "<plist version=\"1.0\">\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "<dict>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <key>CFBundleExecutable</key>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <string>CasioEmuMsvc</string>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <key>CFBundleIdentifier</key>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <string>com.casioemu.ios</string>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <key>CFBundleName</key>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <string>CasioEmuMsvc</string>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <key>CFBundlePackageType</key>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <string>APPL</string>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <key>CFBundleShortVersionString</key>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <string>1.0</string>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <key>CFBundleVersion</key>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "    <string>1</string>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "</dict>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            printf "</plist>\n" >> Payload/CasioEmuMsvc.app/Info.plist
            touch Payload/CasioEmuMsvc.app/CasioEmuMsvc
            chmod +x Payload/CasioEmuMsvc.app/CasioEmuMsvc
          fi
      
      - name: Create IPA file
        run: |
          printf "Creating IPA file...\n"
          if [ -d "Payload" ]; then
            zip -r CasioEmuMsvc.ipa Payload/
            printf "IPA created: CasioEmuMsvc.ipa\n"
            ls -lh CasioEmuMsvc.ipa
          fi
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-iOS
          path: |
            CasioEmuMsvc.ipa
            build-ios/**/*.app
          if-no-files-found: warn
      
      - name: Debug build info
        if: failure()
        run: |
          printf "Debug information:\n"
          printf "Current directory:\n"
          ls -la
          printf "Submodules:\n"
          ls -la | grep -E "SDL|discord|sentry" || printf "No submodules found\n"
          printf "iOS directory:\n"
          ls -la ios/ 2>/dev/null || printf "No ios directory\n"
          printf "Build directories:\n"
          find . -name "*.app" -o -name "*.xcodeproj" 2>/dev/null | head -20
