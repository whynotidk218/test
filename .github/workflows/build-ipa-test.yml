name: Build IPA (Fixed)

on:
  push:
    branches: [ stable ]       # FIX #3: trigger đúng branch
  workflow_dispatch:            # vẫn giữ để chạy thủ công

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # FIX #1: Tạo AppDelegate.h bị thiếu
      - name: Create missing AppDelegate.h
        run: |
          cat > ios/AppDelegate.h << 'EOF'
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end
          EOF
          echo "AppDelegate.h created"

      - name: Create stub files
        run: |
          # DiscordRPC stub
          cat > ios_stubs/DiscordRPC_stub.cpp << 'EOF'
          #ifdef __APPLE__
          #include <TargetConditionals.h>
          #if TARGET_OS_IPHONE
          void Discord_Initialize(const char*, void*, int, const char*) {}
          void Discord_Shutdown(void) {}
          void Discord_RunCallbacks(void) {}
          void Discord_UpdatePresence(void*) {}
          void Discord_ClearPresence(void) {}
          void Discord_Respond(const char*, int) {}
          #endif
          #endif
          EOF

          # CrashHandler stub
          cat > ios_stubs/CrashHandler_stub.cpp << 'EOF'
          #ifdef __APPLE__
          #include <TargetConditionals.h>
          #if TARGET_OS_IPHONE
          #include <stdio.h>
          void InitCrashHandler(void) {}
          void ReportCrash(const char* msg) { printf("Crash: %s\n", msg); }
          void SetCrashHandlerPath(const char*) {}
          #endif
          #endif
          EOF

          # Plugin stub
          cat > ios_stubs/Plugin_stub.cpp << 'EOF'
          #ifdef __APPLE__
          #include <TargetConditionals.h>
          #if TARGET_OS_IPHONE
          #include <stdio.h>
          extern "C" {
              void Plugin_Init(void) { printf("Plugin system disabled on iOS\n"); }
              void Plugin_Shutdown(void) {}
              void Plugin_LoadFromDir(const char*) {}
          }
          #endif
          #endif
          EOF

          echo "Stub files created"

      - name: Create SDL2 symlinks
        run: |
          if [ -d "SDL" ] && [ ! -d "SDL2" ]; then
            ln -s SDL SDL2
            echo "Created symlink: SDL2 -> SDL"
          fi
          if [ -d "SDL_image" ] && [ ! -d "SDL2_image" ]; then
            ln -s SDL_image SDL2_image
            echo "Created symlink: SDL2_image -> SDL_image"
          fi
          ls -la | grep SDL

      - name: Build iOS app with CMake + Xcode
        run: |
          mkdir -p build-ios
          cd build-ios

          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DIOS=ON

          # Lấy tên scheme đầu tiên
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1 | sed 's|^\./||')
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No .xcodeproj found"
            ls -la
            exit 1
          fi
          echo "Project: $PROJECT_FILE"

          SCHEME=$(xcodebuild -project "$PROJECT_FILE" -list 2>/dev/null \
            | awk '/Schemes:/{found=1; next} found && NF{print $1; exit}')
          [ -z "$SCHEME" ] && SCHEME="CasioEmuApp"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build-ios -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            find build-ios -type d | head -30
            exit 1
          fi
          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          # FIX #2: zip từ ngoài để giữ đúng cấu trúc Payload/App.app
          zip -r CasioEmuMsvc.ipa Payload/
          echo "IPA size: $(ls -lh CasioEmuMsvc.ipa | awk '{print $5}')"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-iOS
          path: CasioEmuMsvc.ipa
          compression-level: 0
          if-no-files-found: error
