name: Build IPA for SlideStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Create missing stub files
        run: |
          printf "%s\n" "Creating missing stub files..."
          
          # Tạo main.m
          cat > ios/main.m << 'EOF'
#import <UIKit/UIKit.h>
#import "AppDelegate.h"

int main(int argc, char * argv[]) {
    @autoreleasepool {
        return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
    }
}
EOF
          
          # Tạo DiscordRPC_stub.cpp
          cat > ios_stubs/DiscordRPC_stub.cpp << 'EOF'
#ifdef __APPLE__
#include <TargetConditionals.h>
#if TARGET_OS_IPHONE
void Discord_Initialize(const char* applicationId, void* handlers, int autoRegister, const char* optionalSteamId) {}
void Discord_Shutdown(void) {}
void Discord_RunCallbacks(void) {}
void Discord_UpdatePresence(void* presence) {}
void Discord_ClearPresence(void) {}
void Discord_Respond(const char* userId, int reply) {}
#endif
#endif
EOF
          
          # Tạo CrashHandler_stub.cpp
          cat > ios_stubs/CrashHandler_stub.cpp << 'EOF'
#ifdef __APPLE__
#include <TargetConditionals.h>
#if TARGET_OS_IPHONE
#include <stdio.h>
void InitCrashHandler(void) {}
void ReportCrash(const char* message) { printf("Crash: %s\n", message); }
void SetCrashHandlerPath(const char* path) {}
#endif
#endif
EOF
          
          # Tạo Plugin_stub.cpp
          cat > ios_stubs/Plugin_stub.cpp << 'EOF'
#ifdef __APPLE__
#include <TargetConditionals.h>
#if TARGET_OS_IPHONE
#include <stdio.h>
class PluginManager {
public:
    static PluginManager& GetInstance() { static PluginManager instance; return instance; }
    void Initialize(void) { printf("Plugin system disabled on iOS\n"); }
    void Shutdown(void) {}
    void LoadPlugins(const char* path) {}
private:
    PluginManager() = default;
};
extern "C" {
    void Plugin_Init(void) { PluginManager::GetInstance().Initialize(); }
    void Plugin_Shutdown(void) { PluginManager::GetInstance().Shutdown(); }
    void Plugin_LoadFromDir(const char* dir) { PluginManager::GetInstance().LoadPlugins(dir); }
}
#endif
#endif
EOF
          
          printf "%s\n" "Stub files created"
      
      - name: Create SDL2 symlinks
        run: |
          printf "%s\n" "Creating SDL2 symlinks..."
          
          if [ -d "SDL" ] && [ ! -d "SDL2" ]; then
            ln -s SDL SDL2
            printf "%s\n" "Created symlink: SDL2 -> SDL"
          fi
          
          if [ -d "SDL_image" ] && [ ! -d "SDL2_image" ]; then
            ln -s SDL_image SDL2_image
            printf "%s\n" "Created symlink: SDL2_image -> SDL_image"
          fi
      
      - name: Build iOS app
        run: |
          printf "%s\n" "Building iOS app..."
          
          mkdir -p build-ios
          cd build-ios
          
          printf "%s\n" "Running CMake..."
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DIOS=ON
          
          printf "%s\n" "Finding Xcode project..."
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -n 1 | sed 's|^\./||')
          
          if [ -z "$PROJECT_FILE" ]; then
            printf "%s\n" "ERROR: No Xcode project found"
            ls -la
            exit 1
          fi
          
          printf "%s\n" "Found project: $PROJECT_FILE"
          
          printf "%s\n" "Getting scheme name..."
          SCHEME=$(xcodebuild -project "$PROJECT_FILE" -list 2>/dev/null | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          if [ -z "$SCHEME" ]; then
            printf "%s\n" "Using default scheme: CasioEmuApp"
            SCHEME="CasioEmuApp"
          fi
          
          printf "%s\n" "Using scheme: $SCHEME"
          
          printf "%s\n" "Building project..."
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build
          
          cd ..
      
      - name: Find and package app
        run: |
          printf "%s\n" "Looking for built app..."
          
          APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            printf "%s\n" "ERROR: No .app found"
            exit 1
          fi
          
          printf "%s\n" "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          printf "%s\n" "App copied to Payload/"
      
      - name: Create IPA
        run: |
          printf "%s\n" "Creating IPA file..."
          
          cd Payload
          zip -r ../CasioEmuMsvc.ipa * -q
          cd ..
          
          printf "%s\n" "✅ IPA created successfully!"
          printf "%s\n" "File: CasioEmuMsvc.ipa"
          printf "%s\n" "Size: %s" "$(ls -lh CasioEmuMsvc.ipa | awk '{print $5}')"
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-SlideStore
          path: CasioEmuMsvc.ipa
          compression-level: 0
          if-no-files-found: error
