name: Build ios (idk)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2. Tự tải Submodule thủ công bằng tay với --depth 1 để chạy cực nhanh
      - name: Initialize Submodules Manually
        run: |
          git submodule update --init --recursive --depth 1

      # 3. Cài đặt CMake
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      # 4. Tạo file dự án Xcode bằng CMake cho iOS
      - name: Configure CMake for iOS
        run: |
          mkdir build && cd build
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      # 5. Biên dịch dự án thành file .app (Không cần ký mã - Code Sign)
      - name: Build Xcode Project
        run: |
          cd build
          xcodebuild -configuration Release -sdk iphoneos ARCHS="arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO

      # 6. Đóng gói file .app thành file .ipa chuẩn iOS
      - name: Package .app into .ipa
        run: |
          cd build
          mkdir -p Payload
          # Tự động tìm và copy file .app được sinh ra vào thư mục Payload
          cp -r Release-iphoneos/*.app Payload/
          # Nén thư mục Payload thành file .ipa
          zip -r CasioEmu.ipa Payload

      # 7. Đẩy file .ipa lên mục Artifacts của GitHub để bạn tải về
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmu-iOS-IPA
          path: build/CasioEmu.ipa
