name: Build ios :)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Checkout mã nguồn và CHỈ tải các submodule ở tầng gốc (SDL2, SDL2_image...)
      # Thuộc tính "true" (thay vì recursive) sẽ lấy đủ SDL2 mà không bị treo bởi Sentry.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. Cài đặt CMake
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      # 3. Tạo file dự án Xcode bằng CMake cho iOS
      - name: Configure CMake for iOS
        run: |
          mkdir build && cd build
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      # 4. Biên dịch dự án thành file .app (Không cần ký mã - Code Sign)
      - name: Build Xcode Project
        run: |
          cd build
          xcodebuild -configuration Release -sdk iphoneos ARCHS="arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO

      # 5. Đóng gói file .app thành file .ipa chuẩn iOS
      - name: Package .app into .ipa
        run: |
          cd build
          mkdir -p Payload
          # Tự động tìm và sao chép file .app được sinh ra vào thư mục Payload
          cp -r Release-iphoneos/*.app Payload/
          # Nén thư mục Payload thành file .ipa
          zip -r CasioEmu.ipa Payload

      # 6. Đẩy file .ipa lên mục Artifacts của GitHub để bạn tải về
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmu-iOS-IPA
          path: build/CasioEmu.ipa
