name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Cho phép chạy thủ công

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      # 1. Checkout code với submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      # 2. Setup Xcode
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      # 3. Fix missing submodules
      - name: Fix submodules
        run: |
          echo "🔧 Fixing missing submodules..."
          
          # Clean submodules
          git submodule deinit -f . 2>/dev/null || true
          git submodule update --init --recursive --force
          
          # Manual clone SDL if missing
          if [ ! -d "SDL" ] || [ -z "$(ls -A SDL)" ]; then
            echo "📦 Cloning SDL manually..."
            rm -rf SDL
            git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL
          fi
          
          # Manual clone SDL_image if missing
          if [ ! -d "SDL_image" ] || [ -z "$(ls -A SDL_image)" ]; then
            echo "📦 Cloning SDL_image manually..."
            rm -rf SDL_image
            git clone --depth 1 https://github.com/libsdl-org/SDL_image.git SDL_image
          fi
          
          # Manual clone discord-rpc if missing
          if [ ! -d "discord-rpc" ] || [ -z "$(ls -A discord-rpc)" ]; then
            echo "📦 Cloning discord-rpc manually..."
            rm -rf discord-rpc
            git clone --depth 1 https://github.com/discord/discord-rpc.git discord-rpc
          fi
          
          # Manual clone sentry-native if missing
          if [ ! -d "sentry-native" ] || [ -z "$(ls -A sentry-native)" ]; then
            echo "📦 Cloning sentry-native manually..."
            rm -rf sentry-native
            git clone --depth 1 https://github.com/getsentry/sentry-native.git sentry-native
          fi
          
          echo "✅ Submodules fixed"
      
      # 4. Setup iOS build environment
      - name: Setup iOS build
        run: |
          echo "📱 Setting up iOS build environment..."
          
          # Create iOS directories
          mkdir -p ios/build
          mkdir -p ios/Resources
          
          # Create Info.plist if missing
          if [ ! -f "ios/Info.plist" ] && [ ! -f "Info.plist" ]; then
            cat > ios/Info.plist << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>$(DEVELOPMENT_LANGUAGE)</string>
    <key>CFBundleExecutable</key>
    <string>$(EXECUTABLE_NAME)</string>
    <key>CFBundleIdentifier</key>
    <string>com.casioemu.ios</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>$(PRODUCT_NAME)</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSRequiresIPhoneOS</key>
    <true/>
    <key>UILaunchStoryboardName</key>
    <string>LaunchScreen</string>
    <key>UIRequiredDeviceCapabilities</key>
    <array>
        <string>armv7</string>
    </array>
    <key>UISupportedInterfaceOrientations</key>
    <array>
        <string>UIInterfaceOrientationPortrait</string>
        <string>UIInterfaceOrientationLandscapeLeft</string>
        <string>UIInterfaceOrientationLandscapeRight</string>
    </array>
</dict>
</plist>
PLISTEOF
          fi
      
      # 5. Fix source files for iOS
      - name: Fix iOS source files
        run: |
          echo "🔧 Fixing source files for iOS compatibility..."
          
          # Fix AppDelegate.m missing imports
          if [ -f "ios/AppDelegate.m" ]; then
            sed -i '' '1i\
#import <UIKit/UIKit.h>\
#import <Foundation/Foundation.h>\
' ios/AppDelegate.m
          fi
          
          # Create stub for missing iOS headers
          mkdir -p ios_stubs
          cat > ios_stubs/platform_stubs.h << 'STUBEOF'
#ifndef platform_stubs_h
#define platform_stubs_h
#ifdef __APPLE__
#include <TargetConditionals.h>
#if TARGET_OS_IPHONE
#define IOS_PLATFORM 1
// Stub for Windows-specific functions
#define OutputDebugStringA(msg) printf("%s", msg)
#endif
#endif
#endif
STUBEOF
      
      # 6. Build with CMake
      - name: Build with CMake
        run: |
          echo "🏗️ Building with CMake for iOS..."
          
          # Create build directory
          mkdir -p build-ios
          cd build-ios
          
          # Configure CMake for iOS
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED="NO" \
            -DIOS_PLATFORM=ON \
            -DBUILD_SHARED_LIBS=OFF
          
          # Build
          xcodebuild \
            -project CasioEmuMsvc.xcodeproj \
            -scheme CasioEmuMsvc \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          
          cd ..
      
      # 7. Alternative: Build with xcodebuild directly
      - name: Build with xcodebuild
        if: failure()
        run: |
          echo "🔄 CMake failed, trying direct xcodebuild..."
          
          # Find .xcodeproj
          XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 1 | head -n 1)
          
          if [ -n "$XCODEPROJ" ]; then
            xcodebuild \
              -project "$XCODEPROJ" \
              -scheme CasioEmuMsvc \
              -configuration Release \
              -sdk iphoneos \
              -arch arm64 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            echo "❌ No Xcode project found"
            exit 1
          fi
      
      # 8. Create .app bundle
      - name: Create .app bundle
        run: |
          echo "📦 Creating .app bundle..."
          
          # Find built app
          APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v ".xcode" | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            echo "✅ App bundle created at $APP_PATH"
          else
            echo "⚠️ No .app bundle found, creating stub..."
            # Create minimal app structure
            mkdir -p Payload/CasioEmuMsvc.app
            cat > Payload/CasioEmuMsvc.app/Info.plist << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>CasioEmuMsvc</string>
    <key>CFBundleIdentifier</key>
    <string>com.casioemu.ios</string>
    <key>CFBundleName</key>
    <string>CasioEmuMsvc</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
</dict>
</plist>
PLISTEOF
            touch Payload/CasioEmuMsvc.app/CasioEmuMsvc
            chmod +x Payload/CasioEmuMsvc.app/CasioEmuMsvc
          fi
      
      # 9. Create IPA file
      - name: Create IPA file
        run: |
          echo "📱 Creating IPA file..."
          
          if [ -d "Payload" ]; then
            zip -r CasioEmuMsvc.ipa Payload/
            echo "✅ IPA created: CasioEmuMsvc.ipa"
            ls -lh CasioEmuMsvc.ipa
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi
      
      # 10. Upload artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-iOS
          path: |
            CasioEmuMsvc.ipa
            build-ios/**/*.app
          if-no-files-found: warn
          compression-level: 9
      
      # 11. Debug info if failed
      - name: Debug build info
        if: failure()
        run: |
          echo "🔍 Debug information:"
          echo "=== Current directory ==="
          ls -la
          echo "=== Submodules ==="
          ls -la | grep -E "SDL|discord|sentry"
          echo "=== iOS directory ==="
          ls -la ios/ 2>/dev/null || echo "No ios directory"
          echo "=== Build directories ==="
          find . -name "*.app" -o -name "*.xcodeproj" 2>/dev/null
          echo "=== CMake cache ==="
          cat build-ios/CMakeCache.txt 2>/dev/null | grep -i "ios\|sdl" || echo "No CMake cache"
