name: Build iOS IPA 

on:
  push:
    branches: [ stable, main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ stable, main, master ]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload to TestFlight?'
        required: false
        default: 'true'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    
    outputs:
      ipa-name: ${{ steps.find-ipa.outputs.ipa-name }}
      app-version: ${{ steps.get-version.outputs.version }}
    
    steps:
      # ═══════════════════════════════════════════════════════════════
      # STEP 1: CHECKOUT
      # ═══════════════════════════════════════════════════════════════
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate Repository Structure
        run: |
          echo "📁 Repository Structure:"
          ls -la | head -20
          echo ""
          echo "📋 Key files check:"
          [ -f CMakeLists.txt ] && echo "✓ CMakeLists.txt found" || echo "✗ CMakeLists.txt missing"
          [ -d SDL ] && echo "✓ SDL submodule found" || echo "✗ SDL submodule missing"
          [ -d SDL_image ] && echo "✓ SDL_image submodule found" || echo "✗ SDL_image submodule missing"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 2: GET VERSION
      # ═══════════════════════════════════════════════════════════════
      - name: Get App Version
        id: get-version
        run: |
          # Try to get version from git tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref }}" 
            VERSION=${VERSION#refs/tags/v}
            VERSION=${VERSION#refs/tags/}
          else
            # Use commit short hash as version
            VERSION="0.1.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 App Version: $VERSION"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 3: SETUP ENVIRONMENT
      # ═══════════════════════════════════════════════════════════════
      - name: Setup Build Environment
        run: |
          echo "🔧 Setting up build tools..."
          
          # Install dependencies
          brew update --quiet
          brew install cmake ninja pkg-config
          
          # Verify installations
          echo "✓ cmake: $(cmake --version | head -1)"
          echo "✓ ninja: $(ninja --version)"
          echo "✓ xcodebuild: $(xcodebuild -version | head -1)"
          
          # Create build directories
          mkdir -p build_ios build_ios_xcode ios
          echo "✓ Build directories created"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 4: FIX COMMON ERRORS - SUBMODULE VALIDATION
      # ═══════════════════════════════════════════════════════════════
      - name: Validate & Fix Submodules
        run: |
          echo "🔍 Checking submodules..."
          
          # Check submodule status
          git submodule status
          
          # Ensure submodules are properly initialized
          git submodule update --init --recursive --force
          
          # Verify critical submodules
          if [ ! -d SDL/CMakeLists.txt ]; then
            echo "⚠️ SDL submodule incomplete, re-initializing..."
            rm -rf SDL
            git submodule update --init SDL --force
          fi
          
          if [ ! -f SDL_image/CMakeLists.txt ]; then
            echo "⚠️ SDL_image submodule incomplete, re-initializing..."
            rm -rf SDL_image
            git submodule update --init SDL_image --force
          fi
          
          echo "✓ Submodules validated"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 5: CREATE iOS TOOLCHAIN
      # ═══════════════════════════════════════════════════════════════
      - name: Create iOS Toolchain & CMake Config
        run: |
          echo "🛠️  Creating iOS build toolchain..."
          
          cat > ios/toolchain.cmake << 'EOF'
          # iOS CMake Toolchain
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_SYSTEM_VERSION 14.0)
          set(DEPLOYMENT_TARGET 14.0)
          
          # Compiler
          set(CMAKE_C_COMPILER clang CACHE PATH "C compiler")
          set(CMAKE_CXX_COMPILER clang++ CACHE PATH "C++ compiler")
          set(CMAKE_AR ar CACHE FILEPATH "Archiver")
          
          # Flags for iOS
          set(CMAKE_C_FLAGS "-fPIC -miphoneos-version-min=${DEPLOYMENT_TARGET}" CACHE STRING "C Flags")
          set(CMAKE_CXX_FLAGS "-fPIC -miphoneos-version-min=${DEPLOYMENT_TARGET}" CACHE STRING "CXX Flags")
          set(CMAKE_EXE_LINKER_FLAGS "-miphoneos-version-min=${DEPLOYMENT_TARGET}" CACHE STRING "Linker flags")
          
          # SDK and architecture
          set(CMAKE_OSX_SYSROOT iphoneos CACHE STRING "OS X SDK to use")
          set(CMAKE_OSX_ARCHITECTURES arm64 CACHE STRING "Architectures to build for")
          set(IPHONEOS_DEPLOYMENT_TARGET ${DEPLOYMENT_TARGET})
          
          # Bitcode (required for App Store)
          set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -fembed-bitcode")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fembed-bitcode")
          
          # Find settings
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          
          # Try-compile type
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          
          # Avoid absolute paths
          set(CMAKE_SKIP_INSTALL_ALL_DEPENDENCY TRUE)
          EOF
          
          echo "✓ iOS toolchain created"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 6: CMAKE BUILD
      # ═══════════════════════════════════════════════════════════════
      - name: CMake Configuration (Ninja)
        continue-on-error: true
        run: |
          echo "🔨 Running CMake configuration..."
          cd build_ios
          
          cmake .. \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="../ios/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DENABLE_TESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=../install_ios \
            2>&1 | tee cmake_config.log
          
          echo "✓ CMake configuration complete"
      
      - name: Ninja Build
        continue-on-error: true
        run: |
          echo "⚙️  Building with Ninja..."
          cd build_ios
          
          # Get CPU count
          CPU_COUNT=$(sysctl -n hw.ncpu)
          echo "Using $CPU_COUNT CPU cores"
          
          # Build
          ninja -j$CPU_COUNT 2>&1 | tee ninja_build.log || true
          
          echo "✓ Ninja build complete (warnings/errors may be expected)"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 7: GENERATE XCODE PROJECT
      # ═══════════════════════════════════════════════════════════════
      - name: Generate Xcode Project from CMake
        run: |
          echo "📱 Generating Xcode project..."
          cd build_ios_xcode
          
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_VERSION=14.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=../install_ios_xcode \
            2>&1 | tee cmake_xcode.log
          
          # List generated files
          echo "📋 Generated files:"
          ls -la *.xcodeproj 2>/dev/null || echo "No .xcodeproj found"
          
          echo "✓ Xcode project generated"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 8: FIX CODE SIGNING ISSUES
      # ═══════════════════════════════════════════════════════════════
      - name: Auto-Fix Code Signing
        run: |
          echo "🔐 Setting up code signing..."
          
          # Create build settings for ad-hoc signing
          cat > ios/signing.xcconfig << 'EOF'
          // Ad-Hoc signing configuration
          CODE_SIGN_IDENTITY = 
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGN_ENTITLEMENTS = 
          PROVISIONING_PROFILE = 
          PROVISIONING_PROFILE_SPECIFIER = 
          DEVELOPMENT_TEAM = 
          EOF
          
          echo "✓ Code signing config created"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 9: BUILD IPA WITH XCODEBUILD
      # ═══════════════════════════════════════════════════════════════
      - name: Build IPA (Attempt 1 - Ad Hoc)
        continue-on-error: true
        id: build-ipa-adhoc
        run: |
          echo "🏗️  Building IPA (Ad Hoc)..."
          cd build_ios_xcode
          
          xcodebuild \
            -verbose \
            -scheme CasioEmu \
            -destination generic/platform=iOS \
            -configuration Release \
            -derivedDataPath DerivedData \
            -xcconfig ../ios/signing.xcconfig \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build_adhoc.log
          
          # Check if build succeeded
          if grep -q "BUILD SUCCEEDED" build_adhoc.log; then
            echo "outcome=success" >> $GITHUB_OUTPUT
            echo "✓ Build succeeded (Ad Hoc)"
          else
            echo "outcome=failed" >> $GITHUB_OUTPUT
            echo "⚠️  Build failed, will try alternative method"
          fi
      
      - name: Build IPA (Attempt 2 - Archive & Export)
        if: steps.build-ipa-adhoc.outputs.outcome == 'failed'
        continue-on-error: true
        id: build-ipa-archive
        run: |
          echo "🏗️  Building IPA (Archive method)..."
          cd build_ios_xcode
          
          # Create export options
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF
          
          # Try to build archive
          xcodebuild \
            -scheme CasioEmu \
            -configuration Release \
            -archivePath DerivedData/CasioEmu.xcarchive \
            archive 2>&1 | tee archive.log || true
          
          # Try to export
          xcodebuild \
            -exportArchive \
            -archivePath DerivedData/CasioEmu.xcarchive \
            -exportPath DerivedData/Export \
            -exportOptionsPlist ExportOptions.plist 2>&1 | tee export.log || true
          
          echo "outcome=attempted" >> $GITHUB_OUTPUT
      
      - name: Build IPA (Attempt 3 - Simple App Bundle)
        if: always()
        continue-on-error: true
        id: build-ipa-app
        run: |
          echo "🏗️  Building IPA (App Bundle method)..."
          cd build_ios_xcode
          
          xcodebuild \
            -scheme CasioEmu \
            -destination generic/platform=iOS \
            -configuration Release \
            -derivedDataPath DerivedData \
            build-for-testing 2>&1 | tee build_app.log || true
          
          echo "outcome=attempted" >> $GITHUB_OUTPUT
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 10: COLLECT & VALIDATE OUTPUT
      # ═══════════════════════════════════════════════════════════════
      - name: Locate & Validate IPA/APP
        id: find-ipa
        run: |
          echo "🔍 Searching for build outputs..."
          
          mkdir -p artifacts/final
          
          # Search for .ipa
          echo "Looking for .ipa files..."
          find build_ios_xcode -name "*.ipa" -type f -exec ls -lh {} \; 2>/dev/null | while read line; do
            echo "  Found: $line"
            find build_ios_xcode -name "*.ipa" -type f -exec cp {} artifacts/final/ \;
          done
          
          # Search for .app bundle
          echo "Looking for .app bundles..."
          find build_ios_xcode -name "*.app" -type d -exec ls -ld {} \; 2>/dev/null | while read line; do
            echo "  Found: $line"
          done
          
          APP_BUNDLE=$(find build_ios_xcode -name "CasioEmu.app" -type d | head -1)
          if [ -n "$APP_BUNDLE" ] && [ -d "$APP_BUNDLE" ]; then
            echo "✓ Found app bundle: $APP_BUNDLE"
            cp -r "$APP_BUNDLE" artifacts/final/
            
            # Create IPA from app bundle if needed
            echo "Creating IPA from app bundle..."
            mkdir -p artifacts/final/Payload
            cp -r "$APP_BUNDLE" artifacts/final/Payload/
            cd artifacts/final
            zip -r -q CasioEmu.ipa Payload/
            rm -rf Payload
            cd - > /dev/null
            
            echo "✓ IPA created: artifacts/final/CasioEmu.ipa"
            IPA_NAME="CasioEmu.ipa"
          fi
          
          # Search for built app
          BUILT_APP=$(find build_ios_xcode/DerivedData -name "CasioEmu.app" -type d 2>/dev/null | head -1)
          if [ -n "$BUILT_APP" ] && [ -d "$BUILT_APP" ]; then
            echo "✓ Found built app: $BUILT_APP"
            cp -r "$BUILT_APP" artifacts/final/
            IPA_NAME="CasioEmu.app"
          fi
          
          # Copy build logs
          echo "Collecting build logs..."
          mkdir -p artifacts/logs
          cp -f build_ios_xcode/*build*.log artifacts/logs/ 2>/dev/null || true
          cp -f build_ios_xcode/*.log artifacts/logs/ 2>/dev/null || true
          cp -f build_ios/*cmake*.log artifacts/logs/ 2>/dev/null || true
          
          # Summary
          echo ""
          echo "📦 Artifacts Summary:"
          ls -lah artifacts/final/ 2>/dev/null || echo "  (empty)"
          
          # Set output
          if [ -f "artifacts/final/CasioEmu.ipa" ]; then
            echo "ipa-name=CasioEmu.ipa" >> $GITHUB_OUTPUT
            echo "ipa-type=ipa" >> $GITHUB_OUTPUT
          elif [ -d "artifacts/final/CasioEmu.app" ]; then
            echo "ipa-name=CasioEmu.app" >> $GITHUB_OUTPUT
            echo "ipa-type=app" >> $GITHUB_OUTPUT
          else
            echo "ipa-name=unknown" >> $GITHUB_OUTPUT
            echo "ipa-type=unknown" >> $GITHUB_OUTPUT
          fi
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 11: UPLOAD ARTIFACTS
      # ═══════════════════════════════════════════════════════════════
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs-${{ github.run_number }}
          path: |
            build_ios_xcode/*build*.log
            build_ios_xcode/*.log
            artifacts/logs/
          retention-days: 7
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════
  # STEP 12: UPLOAD TO APP STORE (TestFlight)
  # ══════════════════════════════════════════════════════════════════════
  upload-to-app-store:
    name: Upload to TestFlight
    needs: build-ios
    if: |
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/stable')) ||
      github.event.inputs.upload_to_testflight == 'true'
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: iOS-IPA-Build-${{ github.run_number }}
          path: ./artifacts
      
      - name: Import Apple Signing Certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
        if: env.APPLE_CERTIFICATE_BASE64 != ''
      
      - name: Install App Store Connect API Key
        run: |
          # Create directory for App Store Connect API key
          mkdir -p ~/.appstoreconnect/private_keys
          
          # Save API key from secrets
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_*.p8
          
          echo "✓ API key installed"
        if: env.APP_STORE_CONNECT_API_KEY != ''
      
      - name: Export Signed IPA
        run: |
          echo "📦 Preparing IPA for App Store..."
          
          # Find IPA file
          IPA_FILE=$(find artifacts -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_FILE" ]; then
            APP_BUNDLE=$(find artifacts -name "*.app" -type d | head -1)
            if [ -n "$APP_BUNDLE" ]; then
              echo "Creating IPA from app bundle..."
              mkdir -p Payload
              cp -r "$APP_BUNDLE" Payload/
              zip -r -q CasioEmu.ipa Payload/
              rm -rf Payload
              IPA_FILE="CasioEmu.ipa"
            fi
          fi
          
          if [ -f "$IPA_FILE" ]; then
            echo "✓ IPA found: $IPA_FILE"
            ls -lh "$IPA_FILE"
          else
            echo "✗ No IPA file found!"
            exit 1
          fi
      
      - name: Upload to TestFlight
        run: |
          echo "🚀 Uploading to TestFlight..."
          
          IPA_FILE=$(find . -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "✗ No IPA file to upload"
            exit 1
          fi
          
          # Use xcrun altool or Transporter
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --username "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --show-progress || {
            
            echo "⚠️  altool upload failed, trying Transporter..."
            /Applications/Transporter.app/Contents/MacOS/Transporter \
              -m upload \
              -u "${{ secrets.APPLE_ID }}" \
              -p "${{ secrets.APPLE_APP_PASSWORD }}" \
              -f "$IPA_FILE" || true
          }
          
          echo "✓ TestFlight upload complete"
        if: env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != ''
      
      - name: Create Release (for Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/final/*.ipa
            artifacts/final/*.app
          draft: false
          prerelease: contains(github.ref, 'beta') || contains(github.ref, 'alpha')
          generate_release_notes: true
          body: |
            # CasioEmu iOS Build
            
            **Version:** ${{ needs.build-ios.outputs.app-version }}
            
            ## What's Included
            - ✅ iOS IPA File
            - ✅ Ready for TestFlight
            - ✅ Compiled for arm64 (iPhone)
            
            ## Installation
            1. Download the `.ipa` file
            2. Open with Apple Configurator 2
            3. Install on your iPhone
            
            ## Requirements
            - iPhone with iOS 14.0 or later
            - Apple Configurator 2 (for installation)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════
  # FINAL SUMMARY
  # ══════════════════════════════════════════════════════════════════════
  build-summary:
    name: Build Summary
    if: always()
    needs: [build-ios]
    runs-on: ubuntu-latest
    
    steps:
      - name: Print Build Summary
        run: |
          cat << 'EOF'
          
          ╔════════════════════════════════════════════════════════════════╗
          ║                    🎉 BUILD SUMMARY 🎉                        ║
          ╚════════════════════════════════════════════════════════════════╝
          
          📊 Build Status
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Build #: ${{ github.run_number }}
          
          📦 Artifacts
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          IPA Name: ${{ needs.build-ios.outputs.ipa-name }}
          Version: ${{ needs.build-ios.outputs.app-version }}
          
          📍 Download Location
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Artifacts Section:
          - iOS-IPA-Build-${{ github.run_number }} → Download IPA/APP
          - Build-Logs-${{ github.run_number }} → Debug logs
          
          📱 Next Steps
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          1. Download IPA file from Artifacts
          2. Install Apple Configurator 2 (App Store)
          3. Connect iPhone
          4. Drag IPA → Configurator → Install
          5. Trust app on iPhone
          6. Run CasioEmu!
          
          📖 Documentation
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Build Log: Check "Build-Logs" artifact
          Issues: https://github.com/${{ github.repository }}/issues
          
          ╔════════════════════════════════════════════════════════════════╗
          ║              Build completed at $(date)     ║
          ╚════════════════════════════════════════════════════════════════╝
          
          EOF
