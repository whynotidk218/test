name: Build IPA for SlideStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Create missing stub files
        run: |
          printf "%s\n" "Creating missing stub files..."
          
          printf "%s\n" "#import <UIKit/UIKit.h>" > ios/main.m
          printf "%s\n" "#import \"AppDelegate.h\"" >> ios/main.m
          printf "%s\n" "" >> ios/main.m
          printf "%s\n" "int main(int argc, char * argv[]) {" >> ios/main.m
          printf "%s\n" "    @autoreleasepool {" >> ios/main.m
          printf "%s\n" "        return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));" >> ios/main.m
          printf "%s\n" "    }" >> ios/main.m
          printf "%s\n" "}" >> ios/main.m
          
          printf "%s\n" "#ifdef __APPLE__" > ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "#include <TargetConditionals.h>" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "#if TARGET_OS_IPHONE" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "void Discord_Initialize(const char* applicationId, void* handlers, int autoRegister, const char* optionalSteamId) {}" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "void Discord_Shutdown(void) {}" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "void Discord_RunCallbacks(void) {}" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "void Discord_UpdatePresence(void* presence) {}" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "void Discord_ClearPresence(void) {}" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "void Discord_Respond(const char* userId, int reply) {}" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "#endif" >> ios_stubs/DiscordRPC_stub.cpp
          printf "%s\n" "#endif" >> ios_stubs/DiscordRPC_stub.cpp
          
          printf "%s\n" "#ifdef __APPLE__" > ios_stubs/CrashHandler_stub.cpp
          printf "%s\n" "#include <TargetConditionals.h>" >> ios_stubs/CrashHandler_stub.cpp
          printf "%s\n" "#if TARGET_OS_IPHONE" >> ios_stubs/CrashHandler_stub.cpp
          printf "%s\n" "#include <stdio.h>" >> ios_stubs/CrashHandler_stub.cpp
          printf "%s\n" "void InitCrashHandler(void) {}" >> ios_stubs/CrashHandler_stub.cpp
          printf "%s\n" "void ReportCrash(const char* message) { printf(\"Crash: %%s\\n\", message); }" >> ios_stubs/CrashHandler_stub.cpp
          printf "%s\n" "void SetCrashHandlerPath(const char* path) {}" >> ios_stubs/CrashHandler_stub.cpp
          printf "%s\n" "#endif" >> ios_stubs/CrashHandler_stub.cpp
          printf "%s\n" "#endif" >> ios_stubs/CrashHandler_stub.cpp
          
          printf "%s\n" "#ifdef __APPLE__" > ios_stubs/Plugin_stub.cpp
          printf "%s\n" "#include <TargetConditionals.h>" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "#if TARGET_OS_IPHONE" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "#include <stdio.h>" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "class PluginManager {" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "public:" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "    static PluginManager& GetInstance() { static PluginManager instance; return instance; }" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "    void Initialize(void) { printf(\"Plugin system disabled on iOS\\n\"); }" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "    void Shutdown(void) {}" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "    void LoadPlugins(const char* path) {}" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "private:" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "    PluginManager() = default;" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "};" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "extern \"C\" {" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "    void Plugin_Init(void) { PluginManager::GetInstance().Initialize(); }" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "    void Plugin_Shutdown(void) { PluginManager::GetInstance().Shutdown(); }" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "    void Plugin_LoadFromDir(const char* dir) { PluginManager::GetInstance().LoadPlugins(dir); }" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "}" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "#endif" >> ios_stubs/Plugin_stub.cpp
          printf "%s\n" "#endif" >> ios_stubs/Plugin_stub.cpp
          
          printf "%s\n" "Stub files created"
      
      - name: Create SDL2 symlinks
        run: |
          printf "%s\n" "Creating SDL2 symlinks..."
          
          if [ -d "SDL" ] && [ ! -d "SDL2" ]; then
            ln -s SDL SDL2
            printf "%s\n" "Created symlink: SDL2 -> SDL"
          fi
          
          if [ -d "SDL_image" ] && [ ! -d "SDL2_image" ]; then
            ln -s SDL_image SDL2_image
            printf "%s\n" "Created symlink: SDL2_image -> SDL_image"
          fi
          
          printf "%s\n" "SDL directories:"
          ls -la | grep -E "SDL"
      
      - name: Create Info.plist
        run: |
          printf "%s\n" "Creating Info.plist..."
          
          printf "%s\n" "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" > CasioEmuMsvc/Info.plist
          printf "%s\n" "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "<plist version=\"1.0\">" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "<dict>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>CFBundleDevelopmentRegion</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <string>en</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>CFBundleExecutable</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <string>CasioEmuApp</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>CFBundleIdentifier</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <string>com.casioemu.ios</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>CFBundleInfoDictionaryVersion</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <string>6.0</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>CFBundleName</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <string>CasioEmu</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>CFBundlePackageType</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <string>APPL</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>CFBundleShortVersionString</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <string>1.0</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>CFBundleVersion</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <string>1</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>LSRequiresIPhoneOS</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <true/>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>UIDeviceFamily</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <array>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "        <integer>1</integer>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "        <integer>2</integer>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    </array>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>UISupportedInterfaceOrientations</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <array>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "        <string>UIInterfaceOrientationPortrait</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "        <string>UIInterfaceOrientationLandscapeLeft</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "        <string>UIInterfaceOrientationLandscapeRight</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    </array>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <key>UIRequiredDeviceCapabilities</key>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    <array>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "        <string>armv7</string>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "    </array>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "</dict>" >> CasioEmuMsvc/Info.plist
          printf "%s\n" "</plist>" >> CasioEmuMsvc/Info.plist
          
          printf "%s\n" "Info.plist created"
      
      - name: Build iOS app
        run: |
          printf "%s\n" "Building iOS app..."
          
          mkdir -p build-ios
          cd build-ios
          
          printf "%s\n" "Running CMake..."
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DIOS=ON
          
          printf "%s\n" "Finding Xcode project..."
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -n 1 | sed 's|^\./||')
          
          if [ -z "$PROJECT_FILE" ]; then
            printf "%s\n" "ERROR: No Xcode project found"
            ls -la
            exit 1
          fi
          
          printf "%s\n" "Found project: $PROJECT_FILE"
          
          printf "%s\n" "Getting scheme name..."
          SCHEME=$(xcodebuild -project "$PROJECT_FILE" -list 2>/dev/null | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          if [ -z "$SCHEME" ]; then
            printf "%s\n" "Using default scheme: CasioEmuApp"
            SCHEME="CasioEmuApp"
          fi
          
          printf "%s\n" "Using scheme: $SCHEME"
          
          printf "%s\n" "Building project..."
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build
          
          cd ..
      
      - name: Find and package app
        run: |
          printf "%s\n" "Looking for built app..."
          
          APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            printf "%s\n" "ERROR: No .app found"
            exit 1
          fi
          
          printf "%s\n" "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          printf "%s\n" "App copied to Payload/"
      
      - name: Create IPA
        run: |
          printf "%s\n" "Creating IPA file..."
          
          cd Payload
          zip -r ../CasioEmuMsvc.ipa * -q
          cd ..
          
          printf "%s\n" "IPA created successfully!"
          printf "%s\n" "File: CasioEmuMsvc.ipa"
          printf "%s\n" "Size: %s" "$(ls -lh CasioEmuMsvc.ipa | awk '{print $5}')"
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-SlideStore
          path: CasioEmuMsvc.ipa
          compression-level: 0
          if-no-files-found: error
