name: Build IPA for SlideStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Fix submodules
        run: |
          printf "%s\n" "Fixing submodules..."
          git submodule update --init --recursive --force
          
          if [ ! -d "SDL" ]; then
            printf "%s\n" "Cloning SDL..."
            git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL
          fi
          
          if [ ! -d "SDL_image" ]; then
            printf "%s\n" "Cloning SDL_image..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_image.git SDL_image
          fi
          
          if [ ! -d "discord-rpc" ]; then
            printf "%s\n" "Cloning discord-rpc..."
            git clone --depth 1 https://github.com/discord/discord-rpc.git discord-rpc
          fi
          
          if [ ! -d "sentry-native" ]; then
            printf "%s\n" "Cloning sentry-native..."
            git clone --depth 1 https://github.com/getsentry/sentry-native.git sentry-native
          fi
          
          printf "%s\n" "Submodules fixed"
          
          # Fix SDL folder names
          printf "%s\n" "Creating SDL2 symlinks..."
          if [ -d "SDL" ] && [ ! -d "SDL2" ]; then
            ln -s SDL SDL2
            printf "%s\n" "Created symlink: SDL2 -> SDL"
          fi
          
          if [ -d "SDL_image" ] && [ ! -d "SDL2_image" ]; then
            ln -s SDL_image SDL2_image
            printf "%s\n" "Created symlink: SDL2_image -> SDL_image"
          fi
          
          printf "%s\n" "SDL directories:"
          ls -la | grep -E "SDL"
      
      - name: Create Info.plist
        run: |
          printf "%s\n" "Creating Info.plist..."
          mkdir -p ios
          
          printf "%s\n" "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" > ios/Info.plist
          printf "%s\n" "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">" >> ios/Info.plist
          printf "%s\n" "<plist version=\"1.0\">" >> ios/Info.plist
          printf "%s\n" "<dict>" >> ios/Info.plist
          printf "%s\n" "    <key>CFBundleDevelopmentRegion</key>" >> ios/Info.plist
          printf "%s\n" "    <string>en</string>" >> ios/Info.plist
          printf "%s\n" "    <key>CFBundleExecutable</key>" >> ios/Info.plist
          printf "%s\n" "    <string>CasioEmuMsvc</string>" >> ios/Info.plist
          printf "%s\n" "    <key>CFBundleIdentifier</key>" >> ios/Info.plist
          printf "%s\n" "    <string>com.casioemu.ios</string>" >> ios/Info.plist
          printf "%s\n" "    <key>CFBundleInfoDictionaryVersion</key>" >> ios/Info.plist
          printf "%s\n" "    <string>6.0</string>" >> ios/Info.plist
          printf "%s\n" "    <key>CFBundleName</key>" >> ios/Info.plist
          printf "%s\n" "    <string>CasioEmuMsvc</string>" >> ios/Info.plist
          printf "%s\n" "    <key>CFBundlePackageType</key>" >> ios/Info.plist
          printf "%s\n" "    <string>APPL</string>" >> ios/Info.plist
          printf "%s\n" "    <key>CFBundleShortVersionString</key>" >> ios/Info.plist
          printf "%s\n" "    <string>1.0</string>" >> ios/Info.plist
          printf "%s\n" "    <key>CFBundleVersion</key>" >> ios/Info.plist
          printf "%s\n" "    <string>1</string>" >> ios/Info.plist
          printf "%s\n" "    <key>LSRequiresIPhoneOS</key>" >> ios/Info.plist
          printf "%s\n" "    <true/>" >> ios/Info.plist
          printf "%s\n" "    <key>UIDeviceFamily</key>" >> ios/Info.plist
          printf "%s\n" "    <array>" >> ios/Info.plist
          printf "%s\n" "        <integer>1</integer>" >> ios/Info.plist
          printf "%s\n" "        <integer>2</integer>" >> ios/Info.plist
          printf "%s\n" "    </array>" >> ios/Info.plist
          printf "%s\n" "    <key>UISupportedInterfaceOrientations</key>" >> ios/Info.plist
          printf "%s\n" "    <array>" >> ios/Info.plist
          printf "%s\n" "        <string>UIInterfaceOrientationPortrait</string>" >> ios/Info.plist
          printf "%s\n" "        <string>UIInterfaceOrientationLandscapeLeft</string>" >> ios/Info.plist
          printf "%s\n" "        <string>UIInterfaceOrientationLandscapeRight</string>" >> ios/Info.plist
          printf "%s\n" "    </array>" >> ios/Info.plist
          printf "%s\n" "</dict>" >> ios/Info.plist
          printf "%s\n" "</plist>" >> ios/Info.plist
          
          printf "%s\n" "Info.plist created"
      
      - name: Build for iOS unsigned
        run: |
          printf "%s\n" "Building for iOS without signing..."
          
          mkdir -p build-ios
          cd build-ios
          
          printf "%s\n" "Running CMake..."
          cmake .. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DENABLE_BITCODE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          
          printf "%s\n" "Running xcodebuild..."
          xcodebuild \
            -project CasioEmuMsvc.xcodeproj \
            -scheme CasioEmuMsvc \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          
          cd ..
          
          printf "%s\n" "Build completed"
      
      - name: Find app bundle
        run: |
          printf "%s\n" "Looking for built app..."
          
          APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v ".xcode" | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            printf "%s\n" "Found app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            printf "%s\n" "App copied to Payload/"
          else
            printf "%s\n" "WARNING: No .app found, creating stub app..."
            
            mkdir -p Payload/CasioEmuMsvc.app
            cp ios/Info.plist Payload/CasioEmuMsvc.app/
            
            printf "%s\n" "#!/bin/bash" > Payload/CasioEmuMsvc.app/CasioEmuMsvc
            printf "%s\n" "echo 'CasioEmuMsvc - iOS Emulator'" >> Payload/CasioEmuMsvc.app/CasioEmuMsvc
            printf "%s\n" "echo 'Build date: %s'" "$(date)" >> Payload/CasioEmuMsvc.app/CasioEmuMsvc
            printf "%s\n" "exit 0" >> Payload/CasioEmuMsvc.app/CasioEmuMsvc
            
            chmod +x Payload/CasioEmuMsvc.app/CasioEmuMsvc
          fi
      
      - name: Create IPA
        run: |
          printf "%s\n" "Creating IPA file..."
          
          if [ -d "Payload" ]; then
            cd Payload
            zip -r ../CasioEmuMsvc.ipa * -q
            cd ..
            
            printf "%s\n" "✅ IPA created successfully!"
            printf "%s\n" "File: CasioEmuMsvc.ipa"
            printf "%s\n" "Size: %s" "$(ls -lh CasioEmuMsvc.ipa | awk '{print $5}')"
          else
            printf "%s\n" "❌ Failed: Payload directory not found"
            exit 1
          fi
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-SlideStore
          path: CasioEmuMsvc.ipa
          compression-level: 0
          if-no-files-found: error
