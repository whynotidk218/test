name: Build and Package iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Checkout mã nguồn chính (Tắt hoàn toàn tự động submodule của GitHub)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2. Ép hệ thống tải ĐÚNG các submodule cần thiết bằng lệnh tay
      # Cách này giúp lấy đủ SDL2, SDL2_image mà không động vào đống file lỗi của sentry
      - name: Force Fetch Required Submodules
        run: |
          git submodule update --init --recursive SDL2
          git submodule update --init --recursive SDL2_image
          # Kéo tầng ngoài của sentry-native nếu project yêu cầu (không dùng --recursive ở đây)
          git submodule update --init sentry-native || true

      # 3. Cài đặt CMake
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      # 4. Cấu hình dự án bằng CMake cho iOS
      - name: Configure CMake for iOS
        run: |
          mkdir build && cd build
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      # 5. Biên dịch dự án (Không yêu cầu Code Sign để cài qua TrollStore/AltStore)
      - name: Build Xcode Project
        run: |
          cd build
          xcodebuild -configuration Release -sdk iphoneos ARCHS="arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO

      # 6. Tìm và đóng gói chính xác file .app thành file .ipa
      - name: Package .app into .ipa
        run: |
          cd build
          mkdir -p Payload
          # Tìm file .app vừa build xong và copy vào thư mục Payload
          find Release-iphoneos -name "*.app" -exec cp -r {} Payload/ \;
          # Nén lại thành file .ipa hoàn chỉnh
          zip -r CasioEmu.ipa Payload

      # 7. Đẩy file lên mục Artifacts để bạn tải về
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmu-iOS-IPA
          path: build/CasioEmu.ipa
